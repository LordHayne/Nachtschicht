name: Update components

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "components/**"
      - "scripts/*components*.py"
      - "scripts/validate-manifest.py"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Rebuild manifest from upstream releases
        if: github.event_name != 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/update-components.py

      - name: Validate manifest
        run: python3 scripts/validate-manifest.py

      - name: Commit changes
        if: github.event_name != 'pull_request'
        run: |
          if git diff --quiet components/manifest.json; then
            echo "No component updates."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add components/manifest.json
          git commit -m "Update components"
          git push
